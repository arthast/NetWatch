services:
  target-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: target_service_db
      POSTGRES_USER: target_service
      POSTGRES_PASSWORD: target_service
    ports:
      - "15432:5432"
    volumes:
      - netwatch-target-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U target_service -d target_service_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  target-migrations:
    image: postgres:16
    depends_on:
      target-postgres:
        condition: service_healthy
    volumes:
      - ./scripts/apply_migrations.sh:/usr/local/bin/apply_migrations.sh:ro
      - ./services/target-service/postgresql/migrations:/migrations:ro
    command:
      - bash
      - -lc
      - >
        /usr/local/bin/apply_migrations.sh
        target-service
        /migrations
        postgresql://target_service:target_service@target-postgres:5432/target_service_db

  monitor-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: monitor_service_db
      POSTGRES_USER: monitor_service
      POSTGRES_PASSWORD: monitor_service
    ports:
      - "15434:5432"
    volumes:
      - netwatch-monitor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_service -d monitor_service_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  monitor-migrations:
    image: postgres:16
    depends_on:
      monitor-postgres:
        condition: service_healthy
    volumes:
      - ./scripts/apply_migrations.sh:/usr/local/bin/apply_migrations.sh:ro
      - ./services/monitor-service/postgresql/migrations:/migrations:ro
    command:
      - bash
      - -lc
      - >
        /usr/local/bin/apply_migrations.sh
        monitor-service
        /migrations
        postgresql://monitor_service:monitor_service@monitor-postgres:5432/monitor_service_db

  alert-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: alert_service_db
      POSTGRES_USER: alert_service
      POSTGRES_PASSWORD: alert_service
    ports:
      - "15435:5432"
    volumes:
      - netwatch-alert-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alert_service -d alert_service_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  alert-migrations:
    image: postgres:16
    depends_on:
      alert-postgres:
        condition: service_healthy
    volumes:
      - ./scripts/apply_migrations.sh:/usr/local/bin/apply_migrations.sh:ro
      - ./services/alert-service/postgresql/migrations:/migrations:ro
    command:
      - bash
      - -lc
      - >
        /usr/local/bin/apply_migrations.sh
        alert-service
        /migrations
        postgresql://alert_service:alert_service@alert-postgres:5432/alert_service_db

  notification-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: notification_service_db
      POSTGRES_USER: notification_service
      POSTGRES_PASSWORD: notification_service
    ports:
      - "15436:5432"
    volumes:
      - netwatch-notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_service -d notification_service_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  notification-migrations:
    image: postgres:16
    depends_on:
      notification-postgres:
        condition: service_healthy
    volumes:
      - ./scripts/apply_migrations.sh:/usr/local/bin/apply_migrations.sh:ro
      - ./services/notification-service/postgresql/migrations:/migrations:ro
    command:
      - bash
      - -lc
      - >
        /usr/local/bin/apply_migrations.sh
        notification-service
        /migrations
        postgresql://notification_service:notification_service@notification-postgres:5432/notification_service_db

  auth-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_service_db
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: auth_service
    ports:
      - "15437:5432"
    volumes:
      - netwatch-auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service -d auth_service_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  auth-migrations:
    image: postgres:16
    depends_on:
      auth-postgres:
        condition: service_healthy
    volumes:
      - ./scripts/apply_migrations.sh:/usr/local/bin/apply_migrations.sh:ro
      - ./services/auth-service/postgresql/migrations:/migrations:ro
    command:
      - bash
      - -lc
      - >
        /usr/local/bin/apply_migrations.sh
        auth-service
        /migrations
        postgresql://auth_service:auth_service@auth-postgres:5432/auth_service_db

  kafka:
    image: apache/kafka:3.9.1
    platform: linux/amd64
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "19092:9092"
    volumes:
      - netwatch-kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    platform: linux/amd64
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -lc
      - >
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:9092
        --create
        --if-not-exists
        --topic netwatch.alert.events.v1
        --partitions 3
        --replication-factor 1

  mailpit:
    image: axllent/mailpit:v1.30
    platform: linux/amd64
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

  api-gateway:
    image: ${NETWATCH_API_GATEWAY_IMAGE:-netwatch/api-gateway:local}
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_TARGET: api_gateway
        BUILD_JOBS: ${NETWATCH_BUILD_JOBS:-1}
    platform: linux/amd64
    environment:
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    ports:
      - "8081:8080"
    depends_on:
      target-service:
        condition: service_healthy
      monitor-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 30s
      interval: 2s
      timeout: 2s
      retries: 30

  monitor-service:
    image: ${NETWATCH_MONITOR_SERVICE_IMAGE:-netwatch/monitor-service:local}
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_TARGET: monitor_service
        BUILD_JOBS: ${NETWATCH_BUILD_JOBS:-1}
    platform: linux/amd64
    environment:
      DB_CONNECTION: postgresql://monitor_service:monitor_service@monitor-postgres:5432/monitor_service_db
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    depends_on:
      monitor-postgres:
        condition: service_healthy
      monitor-migrations:
        condition: service_completed_successfully
      target-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 30s
      interval: 2s
      timeout: 2s
      retries: 30

  alert-service:
    image: ${NETWATCH_ALERT_SERVICE_IMAGE:-netwatch/alert-service:local}
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_TARGET: alert_service
        BUILD_JOBS: ${NETWATCH_BUILD_JOBS:-1}
    platform: linux/amd64
    environment:
      DB_CONNECTION: postgresql://alert_service:alert_service@alert-postgres:5432/alert_service_db
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    depends_on:
      alert-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 30s
      interval: 2s
      timeout: 2s
      retries: 30

  notification-service:
    image: ${NETWATCH_NOTIFICATION_SERVICE_IMAGE:-netwatch/notification-service:local}
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_TARGET: notification_service
        BUILD_JOBS: ${NETWATCH_BUILD_JOBS:-1}
    platform: linux/amd64
    environment:
      DB_CONNECTION: postgresql://notification_service:notification_service@notification-postgres:5432/notification_service_db
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    depends_on:
      notification-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 30s
      interval: 2s
      timeout: 2s
      retries: 30

  auth-service:
    image: ${NETWATCH_AUTH_SERVICE_IMAGE:-netwatch/auth-service:local}
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_TARGET: auth_service
        BUILD_JOBS: ${NETWATCH_BUILD_JOBS:-1}
    platform: linux/amd64
    environment:
      DB_CONNECTION: postgresql://auth_service:auth_service@auth-postgres:5432/auth_service_db
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    depends_on:
      auth-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 30s
      interval: 2s
      timeout: 2s
      retries: 30

  target-service:
    image: ${NETWATCH_TARGET_SERVICE_IMAGE:-netwatch/target-service:local}
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_TARGET: target_service
        BUILD_JOBS: ${NETWATCH_BUILD_JOBS:-1}
    platform: linux/amd64
    environment:
      DB_CONNECTION: postgresql://target_service:target_service@target-postgres:5432/target_service_db
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    ports:
      - "8082:8080"
    depends_on:
      target-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 30s
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  netwatch-target-postgres-data:
  netwatch-monitor-postgres-data:
  netwatch-alert-postgres-data:
  netwatch-notification-postgres-data:
  netwatch-auth-postgres-data:
  netwatch-kafka-data:
