syntax = "proto3";

package netwatch.auth.v1;

message User {
  int64 id = 1;
  string email = 2;
  string created_at = 3;
  string updated_at = 4;
  bool email_verified = 5;
  string email_verified_at = 6;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message VerifyEmailRequest {
  string token = 1;
}

message ResendVerificationEmailRequest {
  int64 user_id = 1;
}

message AuthResponse {
  User user = 1;
  string access_token = 2;
  string expires_at = 3;
}

message ValidateTokenResponse {
  User user = 1;
  string expires_at = 2;
}

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse) {}
  rpc Login(LoginRequest) returns (AuthResponse) {}
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse) {}
  rpc VerifyEmail(VerifyEmailRequest) returns (ValidateTokenResponse) {}
  rpc ResendVerificationEmail(ResendVerificationEmailRequest) returns (ValidateTokenResponse) {}
}
