syntax = "proto3";

package netwatch.monitor.v1;

import "netwatch/target_service.proto";

enum CheckStatus {
  CHECK_STATUS_UNSPECIFIED = 0;
  CHECK_STATUS_UP = 1;
  CHECK_STATUS_DOWN = 2;
}

message TargetIdRequest {
  int64 target_id = 1;
}

message CheckResult {
  int64 id = 1;
  int64 target_id = 2;
  CheckStatus status = 3;
  netwatch.target.v1.TargetType protocol = 4;

  optional int32 http_status = 5;
  optional int32 latency_ms = 6;
  optional string error_message = 7;
  string checked_at = 8;
}

message CheckResultResponse {
  CheckResult check = 1;
}

message ListChecksResponse {
  repeated CheckResult checks = 1;
}

service CheckService {
  rpc RunCheck(TargetIdRequest) returns (CheckResultResponse) {}
  rpc ListChecks(TargetIdRequest) returns (ListChecksResponse) {}
  rpc GetTargetStatus(TargetIdRequest) returns (CheckResultResponse) {}
}

enum AlertType {
  ALERT_TYPE_UNSPECIFIED = 0;
  ALERT_TYPE_TARGET_DOWN = 1;
  ALERT_TYPE_TARGET_RECOVERED = 2;
  ALERT_TYPE_HIGH_LATENCY = 3;
}

enum AlertSeverity {
  ALERT_SEVERITY_UNSPECIFIED = 0;
  ALERT_SEVERITY_WARNING = 1;
  ALERT_SEVERITY_CRITICAL = 2;
}

message Alert {
  int64 id = 1;
  int64 target_id = 2;
  AlertType type = 3;
  AlertSeverity severity = 4;
  string message = 5;
  string created_at = 6;
  optional string resolved_at = 7;
}

message ListAlertsRequest {}

message ListAlertsResponse {
  repeated Alert alerts = 1;
}

service AlertService {
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse) {}
  rpc ListActiveAlerts(ListAlertsRequest) returns (ListAlertsResponse) {}
}
