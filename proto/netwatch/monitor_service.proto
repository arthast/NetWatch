syntax = "proto3";

package netwatch.monitor.v1;

enum CheckStatus {
  CHECK_STATUS_UNSPECIFIED = 0;
  CHECK_STATUS_UP = 1;
  CHECK_STATUS_DOWN = 2;
}

enum CheckProtocol {
  CHECK_PROTOCOL_UNSPECIFIED = 0;
  CHECK_PROTOCOL_HTTP = 1;
  CHECK_PROTOCOL_TCP = 2;
}

message TargetIdRequest {
  int64 target_id = 1;
}

message CheckResult {
  int64 id = 1;
  int64 target_id = 2;
  CheckStatus status = 3;
  CheckProtocol protocol = 4;

  optional int32 http_status = 5;
  optional int32 latency_ms = 6;
  optional string error_message = 7;
  string checked_at = 8;
}

message CheckResultResponse {
  CheckResult check = 1;
}

message ListChecksResponse {
  repeated CheckResult checks = 1;
}

service CheckService {
  rpc RunCheck(TargetIdRequest) returns (CheckResultResponse) {}
  rpc ListChecks(TargetIdRequest) returns (ListChecksResponse) {}
  rpc GetTargetStatus(TargetIdRequest) returns (CheckResultResponse) {}
}
