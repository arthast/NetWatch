syntax = "proto3";

package netwatch.notification.v1;

message EmailRecipient {
  int64 id = 1;
  string email = 2;
  bool is_enabled = 3;
  string created_at = 4;
  string updated_at = 5;
  optional int64 user_id = 6;
}

message NotificationDelivery {
  int64 id = 1;
  string event_id = 2;
  string event_type = 3;
  string recipient_email = 4;
  string channel = 5;
  string status = 6;
  int32 attempts = 7;
  string error_message = 8;
  string next_retry_at = 9;
  string created_at = 10;
  string updated_at = 11;
  string delivered_at = 12;
  optional int64 user_id = 13;
  optional int64 target_id = 14;
}

message RecipientIdRequest {
  int64 id = 1;
  optional int64 user_id = 2;
}

message DeliveryIdRequest {
  int64 id = 1;
  optional int64 user_id = 2;
}

message ListEmailRecipientsRequest {
  optional int64 user_id = 1;
}

message ListEmailRecipientsResponse {
  repeated EmailRecipient recipients = 1;
}

message CreateEmailRecipientRequest {
  string email = 1;
  optional int64 user_id = 2;
}

message UpdateEmailRecipientRequest {
  int64 id = 1;
  optional string email = 2;
  optional bool is_enabled = 3;
  optional int64 user_id = 4;
}

message EmailRecipientResponse {
  EmailRecipient recipient = 1;
}

message DeleteEmailRecipientResponse {}

message ListNotificationDeliveriesRequest {
  int32 limit = 1;
  optional string status = 2;
  optional string event_type = 3;
  optional string recipient_email = 4;
  optional int64 user_id = 5;
  optional int64 target_id = 6;
}

message ListNotificationDeliveriesResponse {
  repeated NotificationDelivery deliveries = 1;
}

message NotificationDeliveryResponse {
  NotificationDelivery delivery = 1;
}

message SendTestEmailRequest {
  optional string email = 1;
  optional int64 user_id = 2;
}

message SendTestEmailResponse {
  string event_id = 1;
  int64 recipients_count = 2;
  int64 deliveries_count = 3;
}

message TargetNotificationSettings {
  int64 user_id = 1;
  int64 target_id = 2;
  bool email_enabled = 3;
  string created_at = 4;
  string updated_at = 5;
}

message GetTargetNotificationSettingsRequest {
  int64 user_id = 1;
  int64 target_id = 2;
}

message UpdateTargetNotificationSettingsRequest {
  int64 user_id = 1;
  int64 target_id = 2;
  bool email_enabled = 3;
}

message TargetNotificationSettingsResponse {
  TargetNotificationSettings settings = 1;
}

service NotificationService {
  rpc ListEmailRecipients(ListEmailRecipientsRequest)
      returns (ListEmailRecipientsResponse) {}
  rpc GetEmailRecipient(RecipientIdRequest) returns (EmailRecipientResponse) {}
  rpc CreateEmailRecipient(CreateEmailRecipientRequest)
      returns (EmailRecipientResponse) {}
  rpc UpdateEmailRecipient(UpdateEmailRecipientRequest)
      returns (EmailRecipientResponse) {}
  rpc DeleteEmailRecipient(RecipientIdRequest)
      returns (DeleteEmailRecipientResponse) {}
  rpc ListNotificationDeliveries(ListNotificationDeliveriesRequest)
      returns (ListNotificationDeliveriesResponse) {}
  rpc RetryNotificationDelivery(DeliveryIdRequest)
      returns (NotificationDeliveryResponse) {}
  rpc SendTestEmail(SendTestEmailRequest) returns (SendTestEmailResponse) {}
  rpc GetTargetNotificationSettings(GetTargetNotificationSettingsRequest)
      returns (TargetNotificationSettingsResponse) {}
  rpc UpdateTargetNotificationSettings(UpdateTargetNotificationSettingsRequest)
      returns (TargetNotificationSettingsResponse) {}
}
