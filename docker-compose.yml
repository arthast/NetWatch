services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: netwatch_db
      POSTGRES_USER: netwatch
      POSTGRES_PASSWORD: netwatch
    ports:
      - "15432:5432"
    volumes:
      - netwatch-postgres-data:/var/lib/postgresql/data
      - ./services/target-service/postgresql/migrations/001_create_targets.sql:/docker-entrypoint-initdb.d/001_target_service_create_targets.sql:ro
      - ./services/monitor-service/postgresql/migrations/001_create_check_results.sql:/docker-entrypoint-initdb.d/002_monitor_service_create_check_results.sql:ro
      - ./services/monitor-service/postgresql/migrations/002_create_alerts.sql:/docker-entrypoint-initdb.d/003_monitor_service_create_alerts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netwatch -d netwatch_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  api-gateway:
    image: ghcr.io/userver-framework/ubuntu-24.04-userver:latest
    platform: linux/amd64
    working_dir: /workspace/services/api-gateway
    environment:
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    ports:
      - "8081:8080"
    volumes:
      - .:/workspace
      - netwatch-api-ccache:/workspace/services/api-gateway/.ccache
    depends_on:
      target-service:
        condition: service_healthy
      monitor-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 120s
      interval: 2s
      timeout: 2s
      retries: 30
    command:
      - bash
      - -lc
      - >
        cmake
        -S .
        -B build-compose-debug
        -G Ninja
        -DCMAKE_BUILD_TYPE=Debug
        -DUSERVER_FEATURE_GRPC=ON
        -DUSERVER_SANITIZE='addr;ub'
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON &&
        cmake --build build-compose-debug -j 4 --target api_gateway &&
        ./build-compose-debug/api_gateway
        --config configs/static_config.yaml
        --config_vars configs/config_vars.compose.yaml

  monitor-service:
    image: ghcr.io/userver-framework/ubuntu-24.04-userver:latest
    platform: linux/amd64
    working_dir: /workspace/services/monitor-service
    environment:
      DB_CONNECTION: postgresql://netwatch:netwatch@postgres:5432/netwatch_db
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    volumes:
      - .:/workspace
      - netwatch-ccache:/workspace/services/monitor-service/.ccache
    depends_on:
      postgres:
        condition: service_healthy
      target-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 120s
      interval: 2s
      timeout: 2s
      retries: 30
    command:
      - bash
      - -lc
      - >
        cmake
        -S .
        -B build-compose-debug
        -G Ninja
        -DCMAKE_BUILD_TYPE=Debug
        -DUSERVER_FEATURE_GRPC=ON
        -DUSERVER_FEATURE_POSTGRESQL=ON
        -DUSERVER_SANITIZE='addr;ub'
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON &&
        cmake --build build-compose-debug -j 4 --target monitor_service &&
        ./build-compose-debug/monitor_service
        --config configs/static_config.yaml
        --config_vars configs/config_vars.compose.yaml

  target-service:
    image: ghcr.io/userver-framework/ubuntu-24.04-userver:latest
    platform: linux/amd64
    working_dir: /workspace/services/target-service
    environment:
      DB_CONNECTION: postgresql://netwatch:netwatch@postgres:5432/netwatch_db
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    ports:
      - "8082:8080"
    volumes:
      - .:/workspace
      - netwatch-target-ccache:/workspace/services/target-service/.ccache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 120s
      interval: 2s
      timeout: 2s
      retries: 30
    command:
      - bash
      - -lc
      - >
        cmake
        -S .
        -B build-compose-debug
        -G Ninja
        -DCMAKE_BUILD_TYPE=Debug
        -DUSERVER_FEATURE_GRPC=ON
        -DUSERVER_FEATURE_POSTGRESQL=ON
        -DUSERVER_SANITIZE='addr;ub'
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON &&
        cmake --build build-compose-debug -j 4 --target target_service &&
        ./build-compose-debug/target_service
        --config configs/static_config.yaml
        --config_vars configs/config_vars.compose.yaml

volumes:
  netwatch-postgres-data:
  netwatch-api-ccache:
  netwatch-ccache:
  netwatch-target-ccache:
