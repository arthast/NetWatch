services:
  target-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: target_service_db
      POSTGRES_USER: target_service
      POSTGRES_PASSWORD: target_service
    ports:
      - "15432:5432"
    volumes:
      - netwatch-target-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U target_service -d target_service_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  target-migrations:
    image: postgres:16
    depends_on:
      target-postgres:
        condition: service_healthy
    volumes:
      - ./scripts/apply_migrations.sh:/usr/local/bin/apply_migrations.sh:ro
      - ./services/target-service/postgresql/migrations:/migrations:ro
    command:
      - bash
      - -lc
      - >
        /usr/local/bin/apply_migrations.sh
        target-service
        /migrations
        postgresql://target_service:target_service@target-postgres:5432/target_service_db

  monitor-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: monitor_service_db
      POSTGRES_USER: monitor_service
      POSTGRES_PASSWORD: monitor_service
    ports:
      - "15434:5432"
    volumes:
      - netwatch-monitor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_service -d monitor_service_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  monitor-migrations:
    image: postgres:16
    depends_on:
      monitor-postgres:
        condition: service_healthy
    volumes:
      - ./scripts/apply_migrations.sh:/usr/local/bin/apply_migrations.sh:ro
      - ./services/monitor-service/postgresql/migrations:/migrations:ro
    command:
      - bash
      - -lc
      - >
        /usr/local/bin/apply_migrations.sh
        monitor-service
        /migrations
        postgresql://monitor_service:monitor_service@monitor-postgres:5432/monitor_service_db

  alert-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: alert_service_db
      POSTGRES_USER: alert_service
      POSTGRES_PASSWORD: alert_service
    ports:
      - "15435:5432"
    volumes:
      - netwatch-alert-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alert_service -d alert_service_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  alert-migrations:
    image: postgres:16
    depends_on:
      alert-postgres:
        condition: service_healthy
    volumes:
      - ./scripts/apply_migrations.sh:/usr/local/bin/apply_migrations.sh:ro
      - ./services/alert-service/postgresql/migrations:/migrations:ro
    command:
      - bash
      - -lc
      - >
        /usr/local/bin/apply_migrations.sh
        alert-service
        /migrations
        postgresql://alert_service:alert_service@alert-postgres:5432/alert_service_db

  kafka:
    image: apache/kafka:3.9.1
    platform: linux/amd64
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "19092:9092"
    volumes:
      - netwatch-kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    platform: linux/amd64
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -lc
      - >
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:9092
        --create
        --if-not-exists
        --topic netwatch.alert.events.v1
        --partitions 3
        --replication-factor 1

  api-gateway:
    image: ghcr.io/userver-framework/ubuntu-24.04-userver:latest
    platform: linux/amd64
    working_dir: /workspace/services/api-gateway
    environment:
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    ports:
      - "8081:8080"
    volumes:
      - .:/workspace
      - netwatch-api-ccache:/workspace/services/api-gateway/.ccache
    depends_on:
      target-service:
        condition: service_healthy
      monitor-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 120s
      interval: 2s
      timeout: 2s
      retries: 30
    command:
      - bash
      - -lc
      - >
        cmake
        -S .
        -B build-compose-debug
        -G Ninja
        -DCMAKE_BUILD_TYPE=Debug
        -DUSERVER_FEATURE_GRPC=ON
        -DUSERVER_SANITIZE='${NETWATCH_COMPOSE_SANITIZE:-}'
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON &&
        cmake --build build-compose-debug -j ${NETWATCH_COMPOSE_BUILD_JOBS:-2} --target api_gateway &&
        ./build-compose-debug/api_gateway
        --config configs/static_config.yaml
        --config_vars configs/config_vars.compose.yaml

  monitor-service:
    image: ghcr.io/userver-framework/ubuntu-24.04-userver:latest
    platform: linux/amd64
    working_dir: /workspace/services/monitor-service
    environment:
      DB_CONNECTION: postgresql://monitor_service:monitor_service@monitor-postgres:5432/monitor_service_db
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    volumes:
      - .:/workspace
      - netwatch-ccache:/workspace/services/monitor-service/.ccache
    depends_on:
      monitor-postgres:
        condition: service_healthy
      monitor-migrations:
        condition: service_completed_successfully
      target-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 120s
      interval: 2s
      timeout: 2s
      retries: 30
    command:
      - bash
      - -lc
      - >
        cmake
        -S .
        -B build-compose-debug
        -G Ninja
        -DCMAKE_BUILD_TYPE=Debug
        -DUSERVER_FEATURE_GRPC=ON
        -DUSERVER_FEATURE_POSTGRESQL=ON
        -DUSERVER_SANITIZE='${NETWATCH_COMPOSE_SANITIZE:-}'
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON &&
        cmake --build build-compose-debug -j ${NETWATCH_COMPOSE_BUILD_JOBS:-2} --target monitor_service &&
        ./build-compose-debug/monitor_service
        --config configs/static_config.yaml
        --config_vars configs/config_vars.compose.yaml

  alert-service:
    image: ghcr.io/userver-framework/ubuntu-24.04-userver:latest
    platform: linux/amd64
    working_dir: /workspace/services/alert-service
    environment:
      DB_CONNECTION: postgresql://alert_service:alert_service@alert-postgres:5432/alert_service_db
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    volumes:
      - .:/workspace
      - netwatch-alert-ccache:/workspace/services/alert-service/.ccache
    depends_on:
      alert-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 120s
      interval: 2s
      timeout: 2s
      retries: 30
    command:
      - bash
      - -lc
      - >
        cmake
        -S .
        -B build-compose-debug
        -G Ninja
        -DCMAKE_BUILD_TYPE=Debug
        -DUSERVER_FEATURE_GRPC=ON
        -DUSERVER_FEATURE_POSTGRESQL=ON
        -DUSERVER_SANITIZE='${NETWATCH_COMPOSE_SANITIZE:-}'
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON &&
        cmake --build build-compose-debug -j ${NETWATCH_COMPOSE_BUILD_JOBS:-2} --target alert_service &&
        ./build-compose-debug/alert_service
        --config configs/static_config.yaml
        --config_vars configs/config_vars.compose.yaml

  target-service:
    image: ghcr.io/userver-framework/ubuntu-24.04-userver:latest
    platform: linux/amd64
    working_dir: /workspace/services/target-service
    environment:
      DB_CONNECTION: postgresql://target_service:target_service@target-postgres:5432/target_service_db
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    ports:
      - "8082:8080"
    volumes:
      - .:/workspace
      - netwatch-target-ccache:/workspace/services/target-service/.ccache
    depends_on:
      target-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
      start_period: 120s
      interval: 2s
      timeout: 2s
      retries: 30
    command:
      - bash
      - -lc
      - >
        cmake
        -S .
        -B build-compose-debug
        -G Ninja
        -DCMAKE_BUILD_TYPE=Debug
        -DUSERVER_FEATURE_GRPC=ON
        -DUSERVER_FEATURE_POSTGRESQL=ON
        -DUSERVER_SANITIZE='${NETWATCH_COMPOSE_SANITIZE:-}'
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON &&
        cmake --build build-compose-debug -j ${NETWATCH_COMPOSE_BUILD_JOBS:-2} --target target_service &&
        ./build-compose-debug/target_service
        --config configs/static_config.yaml
        --config_vars configs/config_vars.compose.yaml

volumes:
  netwatch-target-postgres-data:
  netwatch-monitor-postgres-data:
  netwatch-alert-postgres-data:
  netwatch-kafka-data:
  netwatch-api-ccache:
  netwatch-ccache:
  netwatch-alert-ccache:
  netwatch-target-ccache:
