services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    environment:
      NETWATCH_SITE_ADDRESS: ${NETWATCH_SITE_ADDRESS:-netwatch-arsen-demo.online}
    ports:
      - "${NETWATCH_HTTP_PORT:-80}:80"
      - "${NETWATCH_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - netwatch-caddy-data:/data
      - netwatch-caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "caddy version >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  netwatch-caddy-data:
  netwatch-caddy-config:
