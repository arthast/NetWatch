name: ${COMPOSE_PROJECT_NAME:-netwatch-prod}

x-app-common: &app-common
  platform: linux/amd64
  restart: unless-stopped
  init: true
  environment:
    USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
  networks:
    - internal

x-service-healthcheck: &service-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null"]
  start_period: 30s
  interval: 10s
  timeout: 3s
  retries: 12

x-postgres-healthcheck: &postgres-healthcheck
  interval: 10s
  timeout: 3s
  retries: 12

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    environment:
      NETWATCH_SITE_ADDRESS: ${NETWATCH_SITE_ADDRESS:-:80}
    ports:
      - "${NETWATCH_HTTP_PORT:-80}:80"
      - "${NETWATCH_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - netwatch-caddy-data:/data
      - netwatch-caddy-config:/config
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "caddy version >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - edge

  target-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TARGET_POSTGRES_DB:-target_service_db}
      POSTGRES_USER: ${TARGET_POSTGRES_USER:-target_service}
      POSTGRES_PASSWORD: ${TARGET_POSTGRES_PASSWORD:?set TARGET_POSTGRES_PASSWORD}
    volumes:
      - netwatch-target-postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
    networks:
      - internal

  target-migrations:
    image: postgres:16
    depends_on:
      target-postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${TARGET_POSTGRES_DB:-target_service_db}
      POSTGRES_USER: ${TARGET_POSTGRES_USER:-target_service}
      POSTGRES_PASSWORD: ${TARGET_POSTGRES_PASSWORD:?set TARGET_POSTGRES_PASSWORD}
    volumes:
      - ../scripts/apply_migrations.sh:/usr/local/bin/apply_migrations.sh:ro
      - ../services/target-service/postgresql/migrations:/migrations:ro
    command:
      - bash
      - -lc
      - >
        /usr/local/bin/apply_migrations.sh target-service /migrations
        "postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@target-postgres:5432/$${POSTGRES_DB}"
    networks:
      - internal

  monitor-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MONITOR_POSTGRES_DB:-monitor_service_db}
      POSTGRES_USER: ${MONITOR_POSTGRES_USER:-monitor_service}
      POSTGRES_PASSWORD: ${MONITOR_POSTGRES_PASSWORD:?set MONITOR_POSTGRES_PASSWORD}
    volumes:
      - netwatch-monitor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
    networks:
      - internal

  monitor-migrations:
    image: postgres:16
    depends_on:
      monitor-postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${MONITOR_POSTGRES_DB:-monitor_service_db}
      POSTGRES_USER: ${MONITOR_POSTGRES_USER:-monitor_service}
      POSTGRES_PASSWORD: ${MONITOR_POSTGRES_PASSWORD:?set MONITOR_POSTGRES_PASSWORD}
    volumes:
      - ../scripts/apply_migrations.sh:/usr/local/bin/apply_migrations.sh:ro
      - ../services/monitor-service/postgresql/migrations:/migrations:ro
    command:
      - bash
      - -lc
      - >
        /usr/local/bin/apply_migrations.sh monitor-service /migrations
        "postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@monitor-postgres:5432/$${POSTGRES_DB}"
    networks:
      - internal

  alert-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ALERT_POSTGRES_DB:-alert_service_db}
      POSTGRES_USER: ${ALERT_POSTGRES_USER:-alert_service}
      POSTGRES_PASSWORD: ${ALERT_POSTGRES_PASSWORD:?set ALERT_POSTGRES_PASSWORD}
    volumes:
      - netwatch-alert-postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
    networks:
      - internal

  alert-migrations:
    image: postgres:16
    depends_on:
      alert-postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${ALERT_POSTGRES_DB:-alert_service_db}
      POSTGRES_USER: ${ALERT_POSTGRES_USER:-alert_service}
      POSTGRES_PASSWORD: ${ALERT_POSTGRES_PASSWORD:?set ALERT_POSTGRES_PASSWORD}
    volumes:
      - ../scripts/apply_migrations.sh:/usr/local/bin/apply_migrations.sh:ro
      - ../services/alert-service/postgresql/migrations:/migrations:ro
    command:
      - bash
      - -lc
      - >
        /usr/local/bin/apply_migrations.sh alert-service /migrations
        "postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@alert-postgres:5432/$${POSTGRES_DB}"
    networks:
      - internal

  notification-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-notification_service_db}
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER:-notification_service}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:?set NOTIFICATION_POSTGRES_PASSWORD}
    volumes:
      - netwatch-notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
    networks:
      - internal

  notification-migrations:
    image: postgres:16
    depends_on:
      notification-postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-notification_service_db}
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER:-notification_service}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:?set NOTIFICATION_POSTGRES_PASSWORD}
    volumes:
      - ../scripts/apply_migrations.sh:/usr/local/bin/apply_migrations.sh:ro
      - ../services/notification-service/postgresql/migrations:/migrations:ro
    command:
      - bash
      - -lc
      - >
        /usr/local/bin/apply_migrations.sh notification-service /migrations
        "postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@notification-postgres:5432/$${POSTGRES_DB}"
    networks:
      - internal

  kafka:
    image: apache/kafka:3.9.1
    platform: linux/amd64
    restart: unless-stopped
    init: true
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - netwatch-kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - internal

  kafka-init:
    image: apache/kafka:3.9.1
    platform: linux/amd64
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -lc
      - >
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:9092
        --create
        --if-not-exists
        --topic netwatch.alert.events.v1
        --partitions 3
        --replication-factor 1
    networks:
      - internal

  mailpit:
    image: axllent/mailpit:v1.30
    platform: linux/amd64
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - internal

  target-service:
    <<: *app-common
    image: ${NETWATCH_IMAGE_REGISTRY:-ghcr.io/arthast/netwatch}/target-service:${NETWATCH_IMAGE_TAG:-main}
    pull_policy: always
    environment:
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
      DB_CONNECTION: postgresql://${TARGET_POSTGRES_USER:-target_service}:${TARGET_POSTGRES_PASSWORD:?set TARGET_POSTGRES_PASSWORD}@target-postgres:5432/${TARGET_POSTGRES_DB:-target_service_db}
    depends_on:
      target-migrations:
        condition: service_completed_successfully
    healthcheck: *service-healthcheck
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        python3 - "$$DB_CONNECTION" /opt/netwatch/etc/target_service/config_vars.compose.yaml /tmp/config_vars.yaml <<'PY'
        import sys
        from pathlib import Path

        connection, source, destination = sys.argv[1:]
        quoted = "'" + connection.replace("'", "''") + "'"
        lines = []
        for line in Path(source).read_text(encoding="utf-8").splitlines():
            if line.startswith("pg-connection:"):
                lines.append(f"pg-connection: {quoted}")
            else:
                lines.append(line)
        Path(destination).write_text("\n".join(lines) + "\n", encoding="utf-8")
        PY
        exec /opt/netwatch/bin/target_service \
          --config /opt/netwatch/etc/target_service/static_config.yaml \
          --config_vars /tmp/config_vars.yaml

  alert-service:
    <<: *app-common
    image: ${NETWATCH_IMAGE_REGISTRY:-ghcr.io/arthast/netwatch}/alert-service:${NETWATCH_IMAGE_TAG:-main}
    pull_policy: always
    environment:
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
      DB_CONNECTION: postgresql://${ALERT_POSTGRES_USER:-alert_service}:${ALERT_POSTGRES_PASSWORD:?set ALERT_POSTGRES_PASSWORD}@alert-postgres:5432/${ALERT_POSTGRES_DB:-alert_service_db}
    depends_on:
      alert-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *service-healthcheck
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        python3 - "$$DB_CONNECTION" /opt/netwatch/etc/alert_service/config_vars.compose.yaml /tmp/config_vars.yaml <<'PY'
        import sys
        from pathlib import Path

        connection, source, destination = sys.argv[1:]
        quoted = "'" + connection.replace("'", "''") + "'"
        lines = []
        for line in Path(source).read_text(encoding="utf-8").splitlines():
            if line.startswith("pg-connection:"):
                lines.append(f"pg-connection: {quoted}")
            else:
                lines.append(line)
        Path(destination).write_text("\n".join(lines) + "\n", encoding="utf-8")
        PY
        exec /opt/netwatch/bin/alert_service \
          --config /opt/netwatch/etc/alert_service/static_config.yaml \
          --config_vars /tmp/config_vars.yaml

  notification-service:
    <<: *app-common
    image: ${NETWATCH_IMAGE_REGISTRY:-ghcr.io/arthast/netwatch}/notification-service:${NETWATCH_IMAGE_TAG:-main}
    pull_policy: always
    environment:
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
      DB_CONNECTION: postgresql://${NOTIFICATION_POSTGRES_USER:-notification_service}:${NOTIFICATION_POSTGRES_PASSWORD:?set NOTIFICATION_POSTGRES_PASSWORD}@notification-postgres:5432/${NOTIFICATION_POSTGRES_DB:-notification_service_db}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-mailpit}
      NOTIFICATION_EMAIL_PROVIDER_URL: ${NOTIFICATION_EMAIL_PROVIDER_URL:-http://mailpit:8025}
      NOTIFICATION_EMAIL_FROM_EMAIL: ${NOTIFICATION_EMAIL_FROM_EMAIL:-netwatch@example.test}
      NOTIFICATION_EMAIL_FROM_NAME: ${NOTIFICATION_EMAIL_FROM_NAME:-NetWatch}
      NOTIFICATION_EMAIL_SEED_RECIPIENT_EMAIL: ${NOTIFICATION_EMAIL_SEED_RECIPIENT_EMAIL:-alerts@example.test}
      YANDEX_POSTBOX_IAM_TOKEN: ${YANDEX_POSTBOX_IAM_TOKEN:-}
      NOTIFICATION_YANDEX_POSTBOX_METADATA_TOKEN_URL: ${NOTIFICATION_YANDEX_POSTBOX_METADATA_TOKEN_URL:-}
    depends_on:
      notification-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck: *service-healthcheck
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        python3 - "$$DB_CONNECTION" /opt/netwatch/etc/notification_service/config_vars.compose.yaml /tmp/config_vars.yaml <<'PY'
        import os
        import sys
        from pathlib import Path

        connection, source, destination = sys.argv[1:]
        replacements = {
            "pg-connection": connection,
            "notification-email-provider": os.getenv("NOTIFICATION_EMAIL_PROVIDER", ""),
            "notification-email-provider-url": os.getenv("NOTIFICATION_EMAIL_PROVIDER_URL", ""),
            "notification-email-from-email": os.getenv("NOTIFICATION_EMAIL_FROM_EMAIL", ""),
            "notification-email-from-name": os.getenv("NOTIFICATION_EMAIL_FROM_NAME", ""),
            "notification-email-seed-recipient-email": os.getenv("NOTIFICATION_EMAIL_SEED_RECIPIENT_EMAIL", ""),
            "notification-yandex-postbox-metadata-token-url": os.getenv("NOTIFICATION_YANDEX_POSTBOX_METADATA_TOKEN_URL", ""),
        }

        def quote(value: str) -> str:
            return "'" + value.replace("'", "''") + "'"

        lines = []
        for line in Path(source).read_text(encoding="utf-8").splitlines():
            key = line.split(":", 1)[0]
            if key in replacements and replacements[key] != "":
                lines.append(f"{key}: {quote(replacements[key])}")
                continue
            lines.append(line)
        Path(destination).write_text("\n".join(lines) + "\n", encoding="utf-8")
        PY
        exec /opt/netwatch/bin/notification_service \
          --config /opt/netwatch/etc/notification_service/static_config.yaml \
          --config_vars /tmp/config_vars.yaml

  monitor-service:
    <<: *app-common
    image: ${NETWATCH_IMAGE_REGISTRY:-ghcr.io/arthast/netwatch}/monitor-service:${NETWATCH_IMAGE_TAG:-main}
    pull_policy: always
    environment:
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
      DB_CONNECTION: postgresql://${MONITOR_POSTGRES_USER:-monitor_service}:${MONITOR_POSTGRES_PASSWORD:?set MONITOR_POSTGRES_PASSWORD}@monitor-postgres:5432/${MONITOR_POSTGRES_DB:-monitor_service_db}
    depends_on:
      monitor-migrations:
        condition: service_completed_successfully
      target-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
    healthcheck: *service-healthcheck
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        python3 - "$$DB_CONNECTION" /opt/netwatch/etc/monitor_service/config_vars.compose.yaml /tmp/config_vars.yaml <<'PY'
        import sys
        from pathlib import Path

        connection, source, destination = sys.argv[1:]
        quoted = "'" + connection.replace("'", "''") + "'"
        lines = []
        for line in Path(source).read_text(encoding="utf-8").splitlines():
            if line.startswith("pg-connection:"):
                lines.append(f"pg-connection: {quoted}")
            else:
                lines.append(line)
        Path(destination).write_text("\n".join(lines) + "\n", encoding="utf-8")
        PY
        exec /opt/netwatch/bin/monitor_service \
          --config /opt/netwatch/etc/monitor_service/static_config.yaml \
          --config_vars /tmp/config_vars.yaml

  api-gateway:
    <<: *app-common
    image: ${NETWATCH_IMAGE_REGISTRY:-ghcr.io/arthast/netwatch}/api-gateway:${NETWATCH_IMAGE_TAG:-main}
    pull_policy: always
    depends_on:
      target-service:
        condition: service_healthy
      monitor-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
    healthcheck: *service-healthcheck
    networks:
      - edge
      - internal

networks:
  edge:
  internal:

volumes:
  netwatch-caddy-data:
  netwatch-caddy-config:
  netwatch-target-postgres-data:
  netwatch-monitor-postgres-data:
  netwatch-alert-postgres-data:
  netwatch-notification-postgres-data:
  netwatch-kafka-data:
