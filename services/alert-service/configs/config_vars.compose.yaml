worker-threads: 4
worker-fs-threads: 2
producer-worker-threads: 1
logger-level: info

is-testing: false

server-port: 8080
grpc-server-port: 8092

pg-connection: postgresql://alert_service:alert_service@alert-postgres:5432/alert_service_db
secdist-path: configs/secdist.compose.json

alert-outbox-publisher-enabled: true
alert-events-topic: netwatch.alert.events.v1
alert-outbox-batch-size: 50
alert-outbox-publish-period-ms: 1000
alert-outbox-retry-delay-ms: 5000
