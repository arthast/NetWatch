components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads

        fs-task-processor:
            worker_threads: $worker-fs-threads

        producer-task-processor:
            worker_threads: $producer-worker-threads
            thread_name: producer-worker

    default_task_processor: main-task-processor

    components:
        server:
            listener:
                port: $server-port
                task_processor: main-task-processor

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard

        dynamic-config:
            defaults:
                POSTGRES_DEFAULT_COMMAND_CONTROL:
                    network_timeout_ms: 1000
                    statement_timeout_ms: 1000

        testsuite-support: {}

        congestion-control:

        dns-client:
            fs-task-processor: fs-task-processor

        default-secdist-provider:
            config: $secdist-path

        secdist: {}

        kafka-producer-alert-events:
            security_protocol: PLAINTEXT
            delivery_timeout: 3000
            queue_buffering_max: 10
            enable_idempotence: true

        grpc-server:
            port: $grpc-server-port
            completion-queue-count: 3

        alert-grpc-service:
            task-processor: main-task-processor

        alert-outbox-publisher:
            enabled: $alert-outbox-publisher-enabled
            topic: $alert-events-topic
            batch-size: $alert-outbox-batch-size
            publish-period-ms: $alert-outbox-publish-period-ms
            retry-delay-ms: $alert-outbox-retry-delay-ms

        tests-control:
            load-enabled: $is-testing
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor

        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            throttling_enabled: false
            url_trailing_slash: strict-match

        postgres-db-1:
            dbconnection: $pg-connection
            dbconnection#env: DB_CONNECTION
            blocking_task_processor: fs-task-processor
            dns_resolver: async
            sync-start: true
            connlimit_mode: manual
