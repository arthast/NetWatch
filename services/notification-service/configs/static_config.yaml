components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads

        fs-task-processor:
            worker_threads: $worker-fs-threads

        consumer-task-processor:
            worker_threads: $consumer-worker-threads
            thread_name: consumer-worker

        consumer-blocking-task-processor:
            worker_threads: $consumer-blocking-worker-threads
            thread_name: consumer-io

    default_task_processor: main-task-processor

    components:
        server:
            listener:
                port: $server-port
                task_processor: main-task-processor

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard

        dynamic-config:
            defaults:
                HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000
                POSTGRES_DEFAULT_COMMAND_CONTROL:
                    network_timeout_ms: 1000
                    statement_timeout_ms: 1000

        testsuite-support: {}

        congestion-control:

        http-client:
        http-client-core:
            load-enabled: true
            fs-task-processor: fs-task-processor

        dns-client:
            fs-task-processor: fs-task-processor

        default-secdist-provider:
            config: $secdist-path

        secdist: {}

        grpc-server:
            port: $grpc-server-port
            completion-queue-count: 3

        notification-grpc-service:
            task-processor: main-task-processor

        kafka-consumer-alert-events:
            task-processor: main-task-processor
            consumer-task-processor: consumer-task-processor
            consumer-blocking-task-processor: consumer-blocking-task-processor
            group_id: $notification-consumer-group
            client_id: notification-service
            topics:
              - $alert-events-topic
            max_batch_size: $notification-consumer-max-batch-size
            poll_timeout: $notification-consumer-poll-timeout
            restart_after_failure_delay: $notification-consumer-restart-after-failure-delay
            auto_offset_reset: $notification-consumer-auto-offset-reset
            security_protocol: PLAINTEXT

        notification-consumer:
            enabled: $notification-consumer-enabled

        email-delivery-sender:
            enabled: $notification-email-sender-enabled
            provider: $notification-email-provider
            provider#env: NOTIFICATION_EMAIL_PROVIDER
            provider-url: $notification-email-provider-url
            provider-url#env: NOTIFICATION_EMAIL_PROVIDER_URL
            from-email: $notification-email-from-email
            from-email#env: NOTIFICATION_EMAIL_FROM_EMAIL
            from-name: $notification-email-from-name
            from-name#env: NOTIFICATION_EMAIL_FROM_NAME
            seed-recipient-email: $notification-email-seed-recipient-email
            seed-recipient-email#env: NOTIFICATION_EMAIL_SEED_RECIPIENT_EMAIL
            batch-size: $notification-email-sender-batch-size
            send-period-ms: $notification-email-sender-period-ms
            request-timeout-ms: $notification-email-request-timeout-ms
            max-attempts: $notification-email-max-attempts
            retry-delay-ms: $notification-email-retry-delay-ms
            yandex-postbox-iam-token: $notification-yandex-postbox-iam-token
            yandex-postbox-iam-token#env: YANDEX_POSTBOX_IAM_TOKEN
            yandex-postbox-metadata-token-url: $notification-yandex-postbox-metadata-token-url
            yandex-postbox-metadata-token-url#env: NOTIFICATION_YANDEX_POSTBOX_METADATA_TOKEN_URL
            yandex-postbox-token-refresh-skew-sec: $notification-yandex-postbox-token-refresh-skew-sec

        tests-control:
            load-enabled: $is-testing
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor

        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            throttling_enabled: false
            url_trailing_slash: strict-match

        postgres-db-1:
            dbconnection: $pg-connection
            dbconnection#env: DB_CONNECTION
            blocking_task_processor: fs-task-processor
            dns_resolver: async
            sync-start: true
            connlimit_mode: manual
