components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads

        fs-task-processor:
            worker_threads: $worker-fs-threads

    default_task_processor: main-task-processor

    components:
        server:
            listener:
                port: $server-port
                task_processor: main-task-processor

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard

        dynamic-config:
            defaults:
                HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000

        testsuite-support: {}

        congestion-control:

        grpc-client-common:
            blocking-task-processor: fs-task-processor
            completion-queue-count: 2

        grpc-client-factory:
            channel-count: 1

        auth-service-client:
            endpoint: $auth-service-grpc-endpoint

        target-service-client:
            endpoint: $target-service-grpc-endpoint

        check-service-client:
            endpoint: $monitor-service-grpc-endpoint

        alert-service-client:
            endpoint: $alert-service-grpc-endpoint

        notification-service-client:
            endpoint: $notification-service-grpc-endpoint

        target-client:
            transport: grpc

        targets-service: {}

        check-client: {}

        checks-service: {}

        alert-client: {}

        alerts-service: {}

        notification-client: {}

        notifications-service: {}

        auth-client: {}

        auth-service: {}

        tests-control:
            load-enabled: $is-testing
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor

        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            throttling_enabled: false
            url_trailing_slash: strict-match

        handler-swagger-ui:
            path: /docs
            method: GET
            task_processor: main-task-processor
            url_trailing_slash: strict-match

        handler-openapi:
            path: /openapi.json
            method: GET
            task_processor: main-task-processor
            url_trailing_slash: strict-match

        handler-auth-register:
            path: /api/v1/auth/register
            method: POST
            task_processor: main-task-processor

        handler-auth-login:
            path: /api/v1/auth/login
            method: POST
            task_processor: main-task-processor

        handler-auth-me:
            path: /api/v1/auth/me
            method: GET
            task_processor: main-task-processor

        handler-auth-verify-email:
            path: /api/v1/auth/verify-email
            method: POST
            task_processor: main-task-processor

        handler-auth-resend-verification-email:
            path: /api/v1/auth/resend-verification-email
            method: POST
            task_processor: main-task-processor

        handler-targets:
            path: /api/v1/targets
            method: GET,POST
            task_processor: main-task-processor

        handler-target-by-id:
            path: /api/v1/targets/{id}
            method: GET,PATCH,DELETE
            task_processor: main-task-processor

        handler-manual-check:
            path: /api/v1/targets/{id}/check
            method: POST
            task_processor: main-task-processor

        handler-target-checks:
            path: /api/v1/targets/{id}/checks
            method: GET
            task_processor: main-task-processor

        handler-target-status:
            path: /api/v1/targets/{id}/status
            method: GET
            task_processor: main-task-processor

        handler-alerts:
            path: /api/v1/alerts
            method: GET
            task_processor: main-task-processor

        handler-active-alerts:
            path: /api/v1/alerts/active
            method: GET
            task_processor: main-task-processor

        handler-notification-recipients:
            path: /api/v1/notifications/recipients
            method: GET,POST
            task_processor: main-task-processor

        handler-notification-recipient-by-id:
            path: /api/v1/notifications/recipients/{id}
            method: GET,PATCH,DELETE
            task_processor: main-task-processor

        handler-notification-deliveries:
            path: /api/v1/notifications/deliveries
            method: GET
            task_processor: main-task-processor

        handler-notification-delivery-retry:
            path: /api/v1/notifications/deliveries/{id}/retry
            method: POST
            task_processor: main-task-processor

        handler-notification-test-email:
            path: /api/v1/notifications/test-email
            method: POST
            task_processor: main-task-processor

        handler-target-notification-settings:
            path: /api/v1/targets/{id}/notifications
            method: GET,PATCH
            task_processor: main-task-processor
